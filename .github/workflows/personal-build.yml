name: Sync and release personal Helium for macOS

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Previous run containing arm64 build artifact (blank selects latest available)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: personal-macos-build
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.update.outputs.revision }}
      changed: ${{ steps.update.outputs.changed }}
      reuse_run_id: ${{ steps.checkpoint.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge macOS upstream and select patched Helium
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          previous=$(git rev-parse HEAD)
          git remote add upstream https://github.com/imputnet/helium-macos.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git submodule sync
          git submodule update --init
          git -C helium-chromium remote set-url origin https://github.com/RTLiang/helium.git
          git -C helium-chromium fetch origin main
          git -C helium-chromium checkout --detach FETCH_HEAD
          git add helium-chromium
          if ! git diff --cached --quiet; then
            git commit -m 'build: use latest patched Helium'
          fi
          revision=$(git rev-parse HEAD)
          changed=false
          if [ "$revision" != "$previous" ]; then
            git push origin HEAD:main
            changed=true
          else
            # Retry an unpublished revision, including the first personal update build.
            prefix="personal-${revision:0:12}-"
            published=$(gh release list --limit 100 --json tagName,isDraft \
              --jq "any(.[]; (.isDraft == false) and (.tagName | startswith(\"$prefix\")))")
            if [ "$published" = true ]; then
              feed_dir=$(mktemp -d)
              if gh release download personal-updates --pattern appcast-arm64.xml --dir "$feed_dir"; then
                published=$(python3 -c 'import sys, xml.etree.ElementTree as ET; enclosure = ET.parse(sys.argv[1]).find("./channel/item/enclosure"); print("true" if enclosure is not None and sys.argv[2] in enclosure.get("url", "") else "false")' "$feed_dir/appcast-arm64.xml" "/releases/download/$prefix")
              else
                published=false
              fi
              rm -r "$feed_dir"
            fi
            if [ "$published" != true ]; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Select previous build checkpoint
        id: checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          selected=''
          if [ -n "$REQUESTED_RUN" ]; then
            [[ "$REQUESTED_RUN" =~ ^[0-9]+$ ]]
            candidates="$REQUESTED_RUN"
          else
            candidates=$(gh run list --workflow personal-build.yml --status completed --limit 20 --json databaseId --jq '.[].databaseId')
          fi
          for run in $candidates; do
            valid=$(gh api "repos/$GH_REPO/actions/runs/$run/artifacts" --paginate --jq 'any(.artifacts[]; .name == "github_build_artifact_arm64" and .expired == false)')
            if [ "$valid" = true ]; then
              selected="$run"
              break
            fi
          done
          if [ -n "$REQUESTED_RUN" ] && [ -z "$selected" ]; then
            echo 'Requested run has no available arm64 checkpoint' >&2
            exit 1
          fi
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "Selected previous checkpoint: ${selected:-none; fresh build}"

  build:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/building.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      ref: ${{ needs.sync.outputs.revision }}
      reuse_run_id: ${{ needs.sync.outputs.reuse_run_id }}

  release:
    needs: [sync, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: helium_*_arm64-macos.dmg
          path: release_asset
          merge-multiple: true
      - name: Publish personal arm64 DMG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ needs.sync.outputs.revision }}
        run: python3 devutils/publish_personal_update.py release_asset
